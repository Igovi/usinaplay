<header class="header" role="banner">
  <div class="header__container">
    <div class="header__content">
      <div class="header__box-left">
        <ion-menu-toggle menu="main-menu">
        <button
          class="header__menu-button"
          type="button"
          aria-label="Abrir menu"
        >
          <ion-icon 
            class="header__menu-icon" 
            name="menu"
          ></ion-icon>
        </button>
        </ion-menu-toggle>
      </div>

      <div class="header__box-center">
        <button
          class="header__logo-button"
          type="button"
          aria-label="Ir para página inicial"
          (click)="navigateToHome()"
        >
          <img
            class="header__logo"
            src="assets/images/usinaPlayLogo.png"
            alt="Usina Play - Logo"
            loading="eager"
          />
        </button>
      </div>

      <div class="header__box-right">
        <button
          class="header__notification-button"
          type="button"
          aria-label="Ver notificações"
          (click)="navigateToNotifications()"
        >
          <ion-icon 
            class="header__notification-icon" 
            name="notifications"
          ></ion-icon>
          <span 
            *ngIf="hasNotifications" 
            class="header__notification-badge"
            aria-label="Novas notificações"
          ></span>
        </button>
      </div>
    </div>
  </div>
</header>
