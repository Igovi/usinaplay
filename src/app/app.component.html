<ion-app>
  <ion-menu contentId="main-content" type="overlay" menuId="main-menu" side="start">
    <ion-header>
      <ion-toolbar>
        <div class="menu-header">
          <img 
            src="assets/images/usinaPlayLogo.png" 
            alt="Usina Play"
            class="menu-logo"
          />
          <ion-button 
            fill="clear" 
            class="menu-close-button"
            (click)="closeMenu()"
          >
            <ion-icon slot="icon-only" name="close-outline"></ion-icon>
          </ion-button>
        </div>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <div class="menu-content">
        <ion-list lines="none" class="menu-list">
          <ion-item 
            *ngFor="let page of appPages" 
            [routerLink]="page.url" 
            (click)="closeMenu()" 
            class="menu-item"
            button
            detail
            detailIcon="chevron-forward-outline"
          >
            <ion-label>{{ page.title }}</ion-label>
          </ion-item>
        </ion-list>
      </div>
    </ion-content>
  </ion-menu>
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
